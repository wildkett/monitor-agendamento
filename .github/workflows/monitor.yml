name: Monitor de vagas - agendamento médico

on:
  schedule:
    # A cada 20 minutos. O GitHub não garante o horário exato em épocas de
    # alta demanda, mas na prática costuma rodar perto disso.
    - cron: "*/20 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para o job commitar o state.json atualizado

# Duas execuções ao mesmo tempo brigariam pelo push do state.json: a segunda
# encontraria o remoto já adiantado e falharia. Enfileirar em vez de cancelar,
# para não perder uma verificação.
concurrency:
  group: monitor-vagas
  cancel-in-progress: false

jobs:
  verificar-vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar verificação
        env:
          AGENDA_URL: ${{ secrets.AGENDA_URL }}
          CONVENIO: ${{ secrets.CONVENIO }}
          MATRICULA: ${{ secrets.MATRICULA }}
          NOME_COMPLETO: ${{ secrets.NOME_COMPLETO }}
          DATA_NASCIMENTO: ${{ secrets.DATA_NASCIMENTO }}
          CPF: ${{ secrets.CPF }}
          SEXO: ${{ secrets.SEXO }}
          EMAIL: ${{ secrets.EMAIL }}
          TELEFONE: ${{ secrets.TELEFONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Guardar screenshot de erro (se houver)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: erro-debug
          path: erro-debug.png
          if-no-files-found: ignore
          # O screenshot mostra o formulário preenchido (nome, CPF, matrícula,
          # telefone). Ele só é útil nas horas seguintes à falha, então não faz
          # sentido mantê-lo os 90 dias padrão.
          retention-days: 3

      - name: Salvar estado atualizado
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza estado do monitoramento [skip ci]"
          # O remoto pode ter andado desde o checkout (um commit seu, por
          # exemplo). Rebase antes do push evita perder a execução por isso.
          git pull --rebase origin main
          git push
