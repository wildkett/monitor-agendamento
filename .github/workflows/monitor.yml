name: Monitor de vagas - agendamento médico

on:
  schedule:
    # A cada 20 minutos. O GitHub não garante o horário exato quando está
    # concorrido, mas na prática costuma rodar perto disso.
    - cron: "*/20 * * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
    inputs:
      sem_alerta:
        description: "Só registra as vagas, sem avisar no Telegram (use na primeira execução)"
        type: boolean
        default: false

permissions:
  contents: write # o job commita o state.json atualizado

# Duas execuções ao mesmo tempo brigariam pelo push do state.json: a segunda
# acharia o remoto já adiantado e falharia. Enfileiro em vez de cancelar, pra
# não perder uma verificação.
concurrency:
  group: monitor-vagas
  cancel-in-progress: false

jobs:
  verificar-vagas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar verificação
        env:
          AGENDA_URL: ${{ secrets.AGENDA_URL }}
          CONVENIO: ${{ secrets.CONVENIO }}
          MATRICULA: ${{ secrets.MATRICULA }}
          NOME_COMPLETO: ${{ secrets.NOME_COMPLETO }}
          DATA_NASCIMENTO: ${{ secrets.DATA_NASCIMENTO }}
          CPF: ${{ secrets.CPF }}
          SEXO: ${{ secrets.SEXO }}
          EMAIL: ${{ secrets.EMAIL }}
          TELEFONE: ${{ secrets.TELEFONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # A lista de especialidades também é secret: ela diz quais exames
          # estou procurando e não fica versionada.
          ESPECIALIDADES: ${{ secrets.ESPECIALIDADES }}
          # Vazio quando o gatilho é o cron, porque inputs só existe no dispatch.
          SEM_ALERTA: ${{ inputs.sem_alerta }}
        run: npm start

      - name: Guardar screenshot de erro (se houver)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: erro-debug
          path: erro-debug.png
          if-no-files-found: ignore
          # Os campos preenchidos são mascarados antes da captura (src/screenshot.js),
          # mas o arquivo só serve nas horas seguintes à falha. Sem motivo pra
          # ficar os 90 dias padrão.
          retention-days: 1

      - name: Salvar estado atualizado
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza estado do monitoramento [skip ci]"
          # O remoto pode ter andado desde o checkout, um commit meu por
          # exemplo. Rebase antes do push evita perder a execução por isso.
          git pull --rebase origin main
          git push
