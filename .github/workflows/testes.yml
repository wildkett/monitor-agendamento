name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Os testes só leem o código. Sem isto o job herda o token padrão do repositório,
# que pode ter escrita.
permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Sem navegador do Playwright aqui: estes testes são das funções puras
      # (estado e config), não do fluxo no site.
      - name: Rodar testes
        run: npm test
